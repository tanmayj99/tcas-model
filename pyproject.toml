[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcas_model"
version = "0.0.0"
description = "Non-realtime Python model of the TCAS II Collision Avoidance System per RTCA DO-185B Vol. II"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["tcas_model*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
